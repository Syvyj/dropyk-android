<!doctype html>
<!-- README banner and social preview. Render with docs/render-banners.sh; ?lang=en|uk&w=…&h=… -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Manrope"; src: url(../web/fonts/manrope-latin.woff2) format("woff2"); font-weight: 400 800; unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: "Manrope"; src: url(../web/fonts/manrope-cyrillic.woff2) format("woff2"); font-weight: 400 800; unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; }
  body { font-family: "Manrope", system-ui, sans-serif; color: #161b3d; background: #ece9fa; position: relative;
         display: grid; grid-template-columns: 1fr 1.08fr; align-items: center; gap: 4%; padding: 0 6%; }
  body::before, body::after { content: ""; position: absolute; border-radius: 50%; background: #e1dcf7; z-index: 0; }
  body::before { width: 52%; aspect-ratio: 1; right: -12%; top: -38%; }
  body::after { width: 34%; aspect-ratio: 1; left: -10%; bottom: -46%; }
  .copy, .devices { position: relative; z-index: 1; }
  .name { display: flex; align-items: center; gap: .32em; font-size: calc(var(--h) * .17); font-weight: 800; letter-spacing: -.035em; line-height: 1; }
  .name svg { width: .62em; height: .86em; }
  .tag { margin-top: calc(var(--h) * .06); font-size: calc(var(--h) * .062); font-weight: 600; color: #2a2f57; line-height: 1.3; max-width: 17em; }
  .devices { position: relative; padding: 0 14% 10% 0; }
  .tv { padding: 1.2%; background: #23263a; border-radius: 10px; box-shadow: 0 24px 50px rgba(40, 36, 100, .25); }
  .tv img { display: block; width: 100%; border-radius: 4px; }
  .phone { position: absolute; right: 0; bottom: 0; width: 28%; padding: 1.4%; background: #23263a; border-radius: 18px; box-shadow: 0 20px 40px rgba(40, 36, 100, .3); }
  .phone img { display: block; width: 100%; border-radius: 13px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C8DFF"/><stop offset="1" stop-color="#7A4CF0"/></linearGradient></defs>
</svg>
<div class="copy">
  <div class="name">
    <svg viewBox="282 180 460 635"><path fill="url(#g)" d="M512 194C572 304 727 424 727 584A215 215 0 0 1 297 584C297 424 452 304 512 194Z"/><path d="M512 464V684M417 589L512 684L607 589" fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Dropyk
  </div>
  <p class="tag" id="tag"></p>
</div>
<div class="devices">
  <div class="tv"><img id="tv" alt=""></div>
  <div class="phone"><img id="phone" alt=""></div>
</div>
<script>
  const q = new URLSearchParams(location.search), lang = q.get('lang') === 'uk' ? 'uk' : 'en';
  document.documentElement.style.setProperty('--w', (q.get('w') || 1600) + 'px');
  document.documentElement.style.setProperty('--h', (q.get('h') || 560) + 'px');
  // Break after the dash by hand, so the second line never ends up a single word.
  document.getElementById('tag').innerHTML = lang === 'uk'
    ? 'З телефона на телевізор —<br>одним скануванням.' : 'From your phone to the TV —<br>in one scan.';
  document.getElementById('tv').src = `../web/assets/${lang}-tv-waiting.webp`;
  document.getElementById('phone').src = `../web/assets/${lang}-phone.webp`;
</script>
</body>
</html>
