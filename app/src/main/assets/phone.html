<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECE9FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12142B" media="(prefers-color-scheme: dark)">
<title>Dropyk</title>
<!-- Served by the TV itself, so paths are relative. File: raw POST body to upload?name=, with progress; link: POST link. -->
<style>
  :root { --bg:#ECE9FA; --card:#FFFFFF; --line:#DCD7F2; --ink:#161B3D; --muted:#555C7D; --accent:#2E5BE0;
          --blue:#3D7BF7; --violet:#7A4CF0; --soft:#E3E7FD; --ok:#18794E; --bad:#B42318; --slash:#9AA0BC; color-scheme:light dark; }
  /* Follows the phone's theme, in the same colors as the TV's dark one. */
  @media (prefers-color-scheme:dark) {
    :root { --bg:#12142B; --card:#1E2246; --line:#353B6B; --ink:#ECEBFA; --muted:#A6ABCB; --accent:#93ADFF;
            --soft:#2A3060; --ok:#5BD18B; --bad:#FF7A6B; --slash:#5F6590; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif; }
  main { max-width:520px; margin:0 auto; padding:22px 18px 44px; }
  header { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  header svg { width:24px; height:33px; flex:none; }
  .brand { font-size:21px; font-weight:750; letter-spacing:-.01em; }
  .slash { color:var(--slash); font-size:20px; }
  h1 { margin:0; font-size:17px; font-weight:700; }
  .sub { color:var(--muted); font-size:15px; margin:0 0 22px; }
  .pick { display:flex; align-items:center; justify-content:center; width:100%; min-height:58px; padding:14px; border-radius:16px;
          background:linear-gradient(135deg,var(--blue),var(--violet)); color:#fff; font-size:18px; font-weight:700; cursor:pointer;
          box-shadow:0 8px 22px rgba(61,123,247,.28); }
  .pick:focus-within { outline:3px solid var(--accent); outline-offset:3px; }
  .pick input { position:absolute; opacity:0; width:1px; height:1px; }
  .free { color:var(--ink); font-size:14px; margin:12px 2px 0; }
  .seg { display:flex; gap:4px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:4px; margin:16px 0 0; }
  .seg button { flex:1; border:0; border-radius:10px; padding:10px 8px; background:transparent; color:var(--ink); font:inherit; font-size:14px; font-weight:600; }
  .seg button.on { background:var(--soft); color:var(--accent); }
  .seg button.on::before { content:"✓ "; }
  .where { color:var(--muted); font-size:13px; margin:8px 2px 0; }
  ul { list-style:none; margin:18px 0 0; padding:0; }
  li { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:8px; }
  .row { display:flex; justify-content:space-between; gap:10px; font-size:15px; }
  .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pct { color:var(--muted); flex:none; font-variant-numeric:tabular-nums; }
  .bar { height:5px; border-radius:3px; background:var(--soft); margin-top:9px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--blue),var(--violet)); transition:width .2s; }
  li.ok .pct { color:var(--ok); }
  li.bad .pct { color:var(--bad); }
  h2 { font-size:16px; font-weight:700; margin:28px 0 8px; }
  .link { display:flex; gap:8px; }
  .link input { flex:1; min-width:0; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:12px;
                padding:13px 14px; font-size:16px; outline:none; }
  .link input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--soft); }
  .link button { border:0; border-radius:12px; padding:0 16px; background:var(--soft); color:var(--accent); font:inherit; font-weight:700; }
  .note { color:var(--muted); font-size:13px; margin-top:8px; min-height:18px; }
  details { margin-top:30px; }
  summary { display:flex; align-items:center; justify-content:center; gap:10px; min-height:52px; border-radius:16px; background:var(--soft);
            color:var(--accent); font-weight:700; cursor:pointer; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  summary svg { width:20px; height:18px; }
  details p { color:var(--muted); font-size:14px; margin:14px 2px 10px; }
  .give { display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--card); border:1px solid var(--line);
          border-radius:14px; padding:12px 14px; margin-bottom:8px; color:var(--ink); text-decoration:none; }
  .give small { display:block; color:var(--muted); font-size:13px; }
  .give span { color:var(--accent); font-size:18px; }
  button:focus-visible, summary:focus-visible, .give:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  /* Small phones: keep "Dropyk / title" and the two save options on one line each. */
  @media (max-width:360px) {
    main { padding-left:14px; padding-right:14px; }
    header { gap:6px; flex-wrap:nowrap; }
    header svg { width:20px; height:28px; }
    .brand { font-size:18px; }
    .slash { font-size:17px; }
    h1 { font-size:14.5px; white-space:nowrap; }
    .seg button { font-size:13px; padding:10px 4px; white-space:nowrap; }
  }
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="282 180 460 635" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C8DFF"/><stop offset="1" stop-color="#7A4CF2"/></linearGradient></defs>
      <path fill="url(#g)" d="M512 194C572 304 727 424 727 584A215 215 0 0 1 297 584C297 424 452 304 512 194Z"/>
      <path d="M512 464V684M417 589L512 684L607 589" fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="brand">Dropyk</span><span class="slash" aria-hidden="true">/</span><h1 data-t="title"></h1>
  </header>
  <p class="sub" data-t="sub"></p>
  <label class="pick"><span data-t="pick"></span><input id="files" type="file" multiple></label>
  <div class="free" id="free"></div>
  <div class="seg" role="radiogroup">
    <button type="button" data-to="downloads" data-t="toDownloads"></button>
    <button type="button" data-to="sorted" data-t="toSorted"></button>
  </div>
  <div class="where" id="where"></div>
  <ul id="list"></ul>
  <h2 data-t="orLink"></h2>
  <form class="link" id="linkForm">
    <input id="url" type="url" inputmode="url" placeholder="https://youtu.be/…" autocomplete="off">
    <button type="submit" data-t="open"></button>
  </form>
  <div class="note" id="note"></div>
  <details>
    <summary>
      <svg viewBox="0 0 24 22" aria-hidden="true"><path d="M12 20.5C5 15.5 1.5 11.5 2.6 7 3.6 3 8.4 1.8 12 5.6 15.6 1.8 20.4 3 21.4 7 22.5 11.5 19 15.5 12 20.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span data-t="support"></span>
    </summary>
    <p data-t="supportLead"></p>
    <div id="give"></div>
  </details>
</main>
<script>
const T = {
  en: {
    title: 'Send to TV', sub: 'Videos, photos or APKs — the TV offers what to do with each. You can bookmark this page.',
    toDownloads: 'Downloads', toSorted: 'By type', whereDownloads: 'Everything goes to Download/Dropyk on the TV.',
    whereSorted: 'Videos → Movies/Dropyk, photos → Pictures/Dropyk, music → Music/Dropyk, the rest → Download/Dropyk.',
    support: 'Support the author', supportLead: 'Dropyk is free and will stay free.',
    give: [['Ko-fi', 'https://ko-fi.com/syvyj', 'Card or PayPal'], ['Buy Me a Coffee', 'https://buymeacoffee.com/syvyj', 'A coffee, any amount'],
           ['Monobank jar', 'https://send.monobank.ua/jar/5juJPj142b', 'Card, Apple Pay, Google Pay']],
    pick: 'Choose files', orLink: 'Or a link', open: 'Open', free: 'Free on TV: ', waiting: 'waiting', onTv: 'on TV',
    noSpace: 'not enough space', lost: 'connection lost', failed: 'error', needLink: 'Paste a link that starts with https://',
    linkOk: 'Done — confirm on the TV', linkFail: 'Could not send', gb: ' GB', mb: ' MB',
    errors: { no_space: 'not enough space on TV', busy: 'TV is receiving another file', interrupted: 'transfer interrupted',
              cant_create: 'TV could not create the file', unknown_size: 'unknown size', not_a_link: 'not a link' },
  },
  uk: {
    title: 'Передати на телевізор', sub: 'Відео, фото чи APK — телевізор запропонує, що з ним зробити. Цю сторінку можна зберегти в закладки.',
    toDownloads: 'У завантаження', toSorted: 'За типом', whereDownloads: 'Усе лягає в Download/Dropyk на телевізорі.',
    whereSorted: 'Відео → Movies/Dropyk, фото → Pictures/Dropyk, музика → Music/Dropyk, решта → Download/Dropyk.',
    support: 'Підтримати автора', supportLead: 'Dropyk безкоштовний і таким лишиться.',
    give: [['Банка Monobank', 'https://send.monobank.ua/jar/5juJPj142b', 'Картка, Apple Pay, Google Pay'],
           ['Ko-fi', 'https://ko-fi.com/syvyj', 'Картка чи PayPal'], ['Buy Me a Coffee', 'https://buymeacoffee.com/syvyj', 'Кава, будь-яка сума']],
    pick: 'Вибрати файли', orLink: 'Або посилання', open: 'Відкрити', free: 'Вільно на телевізорі: ', waiting: 'чекає', onTv: 'на ТБ',
    noSpace: 'не вистачає місця', lost: 'зв\'язок обірвався', failed: 'помилка', needLink: 'Вставте посилання, що починається з https://',
    linkOk: 'Готово — підтвердіть на телевізорі', linkFail: 'Не вдалося передати', gb: ' ГБ', mb: ' МБ',
    errors: { no_space: 'не вистачає місця на ТБ', busy: 'ТБ уже приймає інший файл', interrupted: 'передачу перервано',
              cant_create: 'ТБ не зміг створити файл', unknown_size: 'невідомий розмір', not_a_link: 'це не посилання' },
  },
};
const t = T[(navigator.language || 'en').slice(0, 2)] || T.en;
document.documentElement.lang = t === T.uk ? 'uk' : 'en';
document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t[el.dataset.t]; });

const $ = (id) => document.getElementById(id);
const size = (b) => b > 1e9 ? (b / 1e9).toFixed(1) + t.gb : (b / 1e6).toFixed(b > 1e8 ? 0 : 1) + t.mb;
let free = null;

async function refreshFree() {
  try {
    free = (await (await fetch('space', { cache: 'no-store' })).json()).free;
    $('free').textContent = t.free + size(free);
  } catch (_) { $('free').textContent = ''; }
}

function send(file, li) {
  return new Promise((done) => {
    const pct = li.querySelector('.pct'), bar = li.querySelector('i');
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'upload?to=' + to + '&name=' + encodeURIComponent(file.name));
    xhr.upload.onprogress = (e) => {
      if (!e.lengthComputable) return;
      const p = Math.round(e.loaded / e.total * 100);
      bar.style.width = p + '%'; pct.textContent = p + '%';
    };
    xhr.onload = () => {
      if (xhr.status === 200) {
        li.className = 'ok'; bar.style.width = '100%';
        let folder = ''; try { folder = JSON.parse(xhr.responseText).folder || ''; } catch (_) {}
        pct.textContent = folder ? t.onTv + ' · ' + folder : t.onTv;
      }
      else { li.className = 'bad'; try { pct.textContent = t.errors[JSON.parse(xhr.responseText).error] || t.failed; } catch (_) { pct.textContent = t.failed; } }
      done();
    };
    xhr.onerror = () => { li.className = 'bad'; pct.textContent = t.lost; done(); };
    xhr.send(file);
  });
}

$('files').addEventListener('change', async (e) => {
  const files = [...e.target.files];
  e.target.value = '';
  const items = files.map((f) => {
    const li = document.createElement('li');
    li.innerHTML = '<div class="row"><span class="name"></span><span class="pct"></span></div><div class="bar"><i></i></div>';
    li.querySelector('.name').textContent = f.name + ' · ' + size(f.size);
    li.querySelector('.pct').textContent = t.waiting;
    $('list').prepend(li);
    return [f, li];
  });
  // One by one: the TV takes one file at a time, and it has one disk anyway.
  for (const [f, li] of items) {
    if (free !== null && f.size > free) { li.className = 'bad'; li.querySelector('.pct').textContent = t.noSpace; continue; }
    await send(f, li);
    await refreshFree();
  }
});

$('linkForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = $('url').value.trim();
  if (!/^https?:\/\//.test(url)) { $('note').textContent = t.needLink; return; }
  const r = await fetch('link', { method: 'POST', body: url }).catch(() => null);
  $('note').textContent = r && r.ok ? t.linkOk : t.linkFail;
  if (r && r.ok) $('url').value = '';
});

// Where files go: remembered on this phone. Storage can throw in private mode, hence the guards.
let to = 'downloads';
try { to = localStorage.getItem('to') || to; } catch (_) {}
function setTo(v) {
  to = v;
  try { localStorage.setItem('to', v); } catch (_) {}
  document.querySelectorAll('.seg button').forEach((b) => {
    b.classList.toggle('on', b.dataset.to === v);
    b.setAttribute('aria-checked', b.dataset.to === v);
    b.setAttribute('role', 'radio');
  });
  $('where').textContent = v === 'sorted' ? t.whereSorted : t.whereDownloads;
}
document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => setTo(b.dataset.to)));
setTo(to);

$('give').innerHTML = t.give.map(() => '<a class="give" target="_blank" rel="noopener"><div><b></b><small></small></div><span aria-hidden="true">↗</span></a>').join('');
[...$('give').children].forEach((a, i) => {
  const [name, url, note] = t.give[i];
  a.href = url; a.querySelector('b').textContent = name; a.querySelector('small').textContent = note;
});

refreshFree();
</script>
</body>
</html>
